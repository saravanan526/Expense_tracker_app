<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b8a4b">
<title>Expense Tracker</title>
<style>
:root{--bg:#f4faf6;--card:#fff;--text:#14301f;--muted:#5d7566;--green:#1b8a4b;--green-d:#13693a;--line:#dcebe1;--red:#c0392b;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a13;--card:#16261c;--text:#e6f3ea;--muted:#8fa89a;--green:#2fb36a;--green-d:#2fb36a;--line:#24392c;--red:#ef6f60;--on:#07140c}}
:root[data-theme="dark"]{--bg:#0e1a13;--card:#16261c;--text:#e6f3ea;--muted:#8fa89a;--green:#2fb36a;--green-d:#2fb36a;--line:#24392c;--red:#ef6f60;--on:#07140c}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:20px;margin:4px 0 12px;color:var(--green-d)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.hero{background:var(--green);color:var(--on);border:0}
.hero .lbl{opacity:.85;font-size:13px}
.hero .big{font-size:30px;font-weight:700}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.3);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--on);border-radius:99px}
.row{display:flex;gap:10px}.row>*{flex:1}
.stat .lbl{color:var(--muted);font-size:13px}.stat .val{font-size:20px;font-weight:700}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
button{font:inherit;border:0;border-radius:10px;padding:12px;background:var(--green);color:var(--on);font-weight:600;width:100%;margin-top:14px}
button.sm{width:auto;margin:0;padding:6px 10px;background:transparent;color:var(--red);border:1px solid var(--line);font-weight:500;font-size:13px}
.hd{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:14px 2px 6px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .m{flex:1;min-width:0}.item .t{font-weight:600}.item .s{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700}
.empty{text-align:center;color:var(--muted);padding:18px}
.neg{color:var(--red)}
.err{color:var(--red);font-size:13px;min-height:16px;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>₹ Expense Tracker</h1>

<div class="card hero">
  <div class="lbl">Remaining this month</div>
  <div class="big" id="remain">₹0</div>
  <div class="bar"><i id="prog" style="width:0%"></i></div>
  <div class="lbl" style="margin-top:6px" id="budgetLine"></div>
</div>

<div class="row">
  <div class="card stat"><div class="lbl">Today</div><div class="val" id="todayTot">₹0</div></div>
  <div class="card stat"><div class="lbl" id="monthLbl">This month</div><div class="val" id="monthTot">₹0</div></div>
</div>

<div class="card">
  <label for="budget" style="margin-top:0">Monthly budget (₹)</label>
  <div class="row" style="align-items:center">
    <input id="budget" type="number" inputmode="decimal" min="0" placeholder="e.g. 20000" style="flex:3">
    <button id="saveBudget" style="flex:1;margin:0">Set</button>
  </div>
</div>

<div class="card">
  <strong>Add expense</strong>
  <label for="amount">Amount (₹)</label>
  <input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
  <label for="category">Category</label>
  <select id="category">
    <option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option>
    <option>Health</option><option>Entertainment</option><option>Other</option>
  </select>
  <label for="date">Date</label>
  <input id="date" type="date">
  <label for="desc">Description</label>
  <input id="desc" type="text" maxlength="80" placeholder="Optional note">
  <div class="err" id="err"></div>
  <button id="add">Add expense</button>
</div>

<div class="card">
  <label for="month" style="margin-top:0">Viewing month</label>
  <input id="month" type="month">
  <div id="list"></div>
</div>
</main>

<script>
(function(){
var EK='expenses.v1', BK='budget.v1', mem={};
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}
function pad(n){return String(n).padStart(2,'0')}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
var inr=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2});
function $(id){return document.getElementById(id)}

var expenses=load(EK,[]), budget=Number(load(BK,0))||0, pendingDel=null;
$('date').value=today();
$('month').value=today().slice(0,7);
if(budget)$('budget').value=budget;

function sum(arr){return arr.reduce(function(a,e){return a+e.amount},0)}

function render(){
  var vm=$('month').value||today().slice(0,7);
  var inMonth=expenses.filter(function(e){return e.date.slice(0,7)===vm});
  var mTot=sum(inMonth), tTot=sum(expenses.filter(function(e){return e.date===today()}));
  $('todayTot').textContent=inr.format(tTot);
  $('monthTot').textContent=inr.format(mTot);
  $('monthLbl').textContent=vm===today().slice(0,7)?'This month':'Spent in '+vm;
  var rem=budget-mTot;
  $('remain').textContent=budget?inr.format(rem):'Set a budget';
  $('remain').className='big';
  $('prog').style.width=budget?Math.min(100,mTot/budget*100)+'%':'0%';
  $('budgetLine').textContent=budget?(rem<0?'Over budget by '+inr.format(-rem):inr.format(mTot)+' of '+inr.format(budget)+' spent'):'No budget set yet';

  var list=$('list'); list.textContent='';
  if(!inMonth.length){var d=document.createElement('div');d.className='empty';d.textContent='No expenses this month.';list.appendChild(d);return}
  var sorted=inMonth.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id});
  var cur=null;
  sorted.forEach(function(e){
    if(e.date!==cur){
      cur=e.date;
      var dayTot=sum(inMonth.filter(function(x){return x.date===cur}));
      var h=document.createElement('div');h.className='hd';
      var a=document.createElement('span');a.textContent=new Date(cur+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
      var b=document.createElement('span');b.textContent=inr.format(dayTot);
      h.appendChild(a);h.appendChild(b);list.appendChild(h);
    }
    var it=document.createElement('div');it.className='item';
    var m=document.createElement('div');m.className='m';
    var t=document.createElement('div');t.className='t';t.textContent=e.category;
    var s=document.createElement('div');s.className='s';s.textContent=e.desc||'—';
    m.appendChild(t);m.appendChild(s);
    var am=document.createElement('div');am.className='amt';am.textContent=inr.format(e.amount);
    var del=document.createElement('button');del.className='sm';
    del.textContent=pendingDel===e.id?'Sure?':'Delete';
    del.onclick=function(){
      if(pendingDel===e.id){expenses=expenses.filter(function(x){return x.id!==e.id});save(EK,expenses);pendingDel=null}
      else{pendingDel=e.id;setTimeout(function(){if(pendingDel===e.id){pendingDel=null;render()}},3000)}
      render();
    };
    it.appendChild(m);it.appendChild(am);it.appendChild(del);list.appendChild(it);
  });
}

$('add').onclick=function(){
  var amt=parseFloat($('amount').value), date=$('date').value;
  if(!(amt>0)){$('err').textContent='Enter an amount greater than 0.';return}
  if(!date){$('err').textContent='Pick a date.';return}
  $('err').textContent='';
  expenses.push({id:Date.now(),amount:Math.round(amt*100)/100,category:$('category').value,date:date,desc:$('desc').value.trim()});
  save(EK,expenses);
  $('amount').value='';$('desc').value='';
  $('month').value=date.slice(0,7);
  render();
};
$('saveBudget').onclick=function(){
  var b=parseFloat($('budget').value);
  budget=b>0?b:0;save(BK,budget);render();
};
$('month').onchange=render;
render();
})();
</script>
</body>
</html>
